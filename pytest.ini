[pytest]
# 1. Test Discovery
# Tells pytest where to look for your test files
testpaths = dv/tests

# 2. Default CLI Flags
# -s: Disables stdout capturing so Cocotb's simulator logs print in real-time
# -v: Enables verbose output for clearer pass/fail summaries
addopts = -s -v

# 3. Custom Markers
# Categorize your tests to run specific blocks (e.g., `pytest -m alu`)
markers =
    alu: Directed tests for the Arithmetic Logic Unit
    regfile: Tests for the Register File
    core: Full integration tests running assembly binaries

# 4. Live Logging Configuration
# Forces pytest to print simulator logs cleanly with timestamps
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %H:%M:%S